<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{base}}favicon.png?v={{fav}}" type="image/png" sizes="64x64">
  <link rel="icon" href="{{base}}favicon.svg?v={{fav}}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{base}}apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap">
  <link rel="stylesheet" href="{{base}}assets/katex/katex.min.css">
  <link rel="stylesheet" href="{{base}}assets/styles/main.css?v={{v}}">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="{{page}}" style="--accent: {{accent}}">
  <a class="skip-link" href="#main">Skip to content</a>
{{header}}
  <main id="main" class="site-main">{{main}}</main>
  <script type="application/json" id="site-data">{{data}}</script>
  <script type="application/json" id="doc-data">{{doc}}</script>
  <script type="module" src="{{base}}assets/js/app.js?v={{v}}"></script>
  {{devscript}}
</body>
</html>
